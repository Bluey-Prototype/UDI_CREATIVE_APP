<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | UDI Creativa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/register.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<main class="register-screen">

    <div class="register-container">

        <a href="login.html" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <img src="assets/logo.png"
             alt="Logo UDI Creativa"
             class="register-logo">

        <h1>Crear cuenta</h1>

        <p>Únete a la comunidad creativa de la UDI.</p>

        <form>

            <div class="input-group">

                <label>Nombre completo</label>

                <input type="text"
                       placeholder="Ingresa tu nombre">

            </div>

            <div class="input-group">

                <label>Correo</label>

                <input type="email"
                       placeholder="ejemplo@udi.edu.bo">

            </div>


            <div class="input-group">

                <label>Contraseña</label>

                <div class="password-box">

                    <input type="password"
                           placeholder="••••••••">

                    <i class="fa-regular fa-eye"></i>

                </div>

            </div>
            <div class="password-strength">

    <div class="strength-bar">

        <div class="strength-fill"></div>

    </div>

    <p class="strength-text">
        Ingresa una contraseña
    </p>

</div>

            <div class="input-group">

                <label>Confirmar contraseña</label>

                <div class="password-box">

                    <input type="password"
                           placeholder="••••••••">

                    <i class="fa-regular fa-eye"></i>

                </div>

            </div>

            <a href="home.html"
               class="register-btn">

                Crear cuenta

            </a>

        </form>

        <div class="login-link">

            ¿Ya tienes una cuenta?

            <a href="login.html">

                Iniciar sesión

            </a>

        </div>

    </div>

</main>

<script src="js/register.js"></script>

</body>

</html>
