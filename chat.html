<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat | UDI Creativa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">

</head>

<body>

<main class="chat-page">

    <!-- HEADER -->

    <header class="chat-header">

        <a href="home.html" class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </a>

        <h2>Chat</h2>

    </header>

    <!-- BUSCADOR -->

    <div class="search-box">

        <i class="fa-solid fa-magnifying-glass"></i>

        <input
            type="text"
            placeholder="Buscar conversación...">

    </div>

    <!-- LISTA DE CHATS -->

    <section class="chat-list">

        <a href="conversation.html" class="chat-item">

            <img src="assets/user1.jpg" alt="Usuario">

            <div class="chat-info">

                <h3>María Fernández</h3>

                <p>¿Puedes revisar mi branding?</p>

            </div>

            <div class="chat-meta">

                <span>10:25</span>

                <div class="unread"></div>

            </div>

        </a>

        <a href="conversation.html" class="chat-item">

            <img src="assets/user2.jpg" alt="Usuario">

            <div class="chat-info">

                <h3>Carlos Rojas</h3>

                <p>Gracias por el feedback.</p>

            </div>

            <div class="chat-meta">

                <span>09:40</span>

            </div>

        </a>

        <a href="conversation.html" class="chat-item">

            <img src="assets/user3.jpg" alt="Usuario">

            <div class="chat-info">

                <h3>Jose Alvarez</h3>

                <p>Recuerda entregar el proyecto.</p>

            </div>

            <div class="chat-meta">

                <span>Ayer</span>

            </div>

        </a>

        <a href="conversation.html" class="chat-item">

            <img src="assets/user4.jpg" alt="Usuario">

            <div class="chat-info">

                <h3>Sergio Pérez</h3>

                <p>Te envié el archivo de Illustrator.</p>

            </div>

            <div class="chat-meta">

                <span>Lun</span>

            </div>

        </a>

    </section>

</main>
<!-- ================= MENÚ INFERIOR ================= -->

<nav class="bottom-nav">

    <a href="home.html" class="nav-item">

        <i class="fa-solid fa-house"></i>

        <span>Inicio</span>

    </a>

    <a href="portafolio.html" class="nav-item">

        <i class="fa-solid fa-images"></i>

        <span>Descubre</span>

    </a>

    <a href="chat.html" class="nav-item active">

        <i class="fa-solid fa-comments"></i>

        <span>Chat</span>

    </a>

    <a href="convocatorias.html" class="nav-item">

        <i class="fa-solid fa-briefcase"></i>

        <span>Convocatorias</span>

    </a>

    <a href="profile.html" class="nav-item">

        <i class="fa-solid fa-user"></i>

        <span>Perfil</span>

    </a>

</nav>
<script src="js/chat.js"></script>


</body>


</html>
