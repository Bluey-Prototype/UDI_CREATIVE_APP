<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva contraseña | UDI Creativa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/new-password.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<main class="new-password-screen">

    <div class="new-password-container">

        <a href="verify-code.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <img src="assets/logo.png"
            alt="Logo UDI Creativa"
            class="new-password-logo">

        <h1>Nueva contraseña</h1>

        <p>

            Crea una contraseña segura para proteger tu cuenta.

        </p>

        <form>

            <div class="input-group">

                <label>Nueva contraseña</label>

                <div class="password-box">

                    <input type="password"
                        placeholder="••••••••">

                    <i class="fa-regular fa-eye"></i>

                </div>

            </div>

            <div class="input-group">

                <label>Confirmar contraseña</label>

                <div class="password-box">

                    <input type="password"
                        placeholder="••••••••">

                    <i class="fa-regular fa-eye"></i>

                </div>

            </div>

            <a href="login.html" class="save-btn">
    Guardar contraseña
</a>

        </form>

    </div>

</main>

<script src="js/new-password.js"></script>

</body>

</html>
