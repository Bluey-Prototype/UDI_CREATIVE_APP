<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | UDI Creativa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forgot-password.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<main class="forgot-screen">

    <div class="forgot-container">

        <a href="login.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <img src="assets/logo.png" alt="Logo UDI Creativa" class="forgot-logo">

        <h1>¿Olvidaste tu contraseña?</h1>

        <p>
            Ingresa tu correo institucional y te enviaremos un enlace para restablecer tu contraseña.
        </p>

        <form>

            <div class="input-group">

                <label>Correo electrónico</label>

                <input
                    type="email"
                    placeholder="ejemplo@udi.edu.bo">

            </div>

           <a href="verify-code.html" class="reset-btn">
    Enviar enlace
</a>

        </form>

    </div>

</main>


</body>
</html>
